[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewer"
version = "0.1.0"
description = "陪面 · 通用岗位 AI 模拟面试教练（W1 骨架）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "pydantic>=2.7",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# C5 稠密腿（不装 = config 链只走 local，全部测试仍绿；装了才可用 dense/hybrid）
dense = ["fastembed>=0.9", "numpy>=1.26"]
# api-service 传输层（SPEC-api-service §2；不装 = web 测试组 importorskip 整组跳过，
# 其余测试不受影响——dense 同款契约。httpx 供 TestClient 离线契约测试随组安装：
# starlette 1.10 的 TestClient 首选 httpx2——由引擎基础依赖链（openai 等）必带，
# 组内 httpx 是按组安装时的兼容兜底）
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
interviewer = "interviewer.cli.app:main"

[tool.setuptools.packages.find]
include = ["interviewer*"]

[tool.pytest.ini_options]
markers = [
    "unit: 离线单元测试（默认回归）",
    "integration: 真联网测试（手动跑，不进默认回归）",
]
