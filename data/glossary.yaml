# 领域术语词表（WP-C6③）：canonical + aliases 的硬映射。
#
# 三个消费方（词表因此不腐化——每个消费方都反向逼词表长全）：
#   1. lint_bank 第 8 节：题库 tag ↔ 词表对账（未知 tag ⚠ 报告）
#   2. promote_staging：候选题 tag 不在词表 → 该文件中止不入库（"拒绝入库"硬闸）
#   3. gen_rag_goldset synonym 桶：alias↔canonical 换面变体 query（测同义鲁棒性）
#
# 纪律：
# - tag 必须先入表再入库（表覆盖全部现行 61 个 tag——test_glossary 锁同步）
# - aliases 只追加不改 canonical（改 canonical = 全库 tag 迁移，另走专项）
# - 别名保守主义：只收"确实有人这么叫"的面，胡编英文别名 = 给 synonym 框
#   噪音；拉丁面在匹配时带词边界护栏（"os" 不会切中 "postgres"）
# - 条目分两类：tag 条目（canonical=tag 本身）与术语条目（非 tag，如
#   垃圾回收——查询变体/归一用，lint 不检查它们）

entries:
